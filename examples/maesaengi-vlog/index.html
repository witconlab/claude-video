<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>매생이 효능 1분 브이로그</title>
<meta name="viewport" content="width=1080">
<style>
@font-face{font-family:'Noto KR';font-weight:500;src:url(fonts/noto-sans-kr-korean-500-normal.woff2) format('woff2');unicode-range:U+1100-11FF,U+2000-2BFF,U+3000-33FF,U+AC00-D7AF,U+FF00-FFEF}
@font-face{font-family:'Noto KR';font-weight:700;src:url(fonts/noto-sans-kr-korean-700-normal.woff2) format('woff2');unicode-range:U+1100-11FF,U+2000-2BFF,U+3000-33FF,U+AC00-D7AF,U+FF00-FFEF}
@font-face{font-family:'Noto KR';font-weight:900;src:url(fonts/noto-sans-kr-korean-900-normal.woff2) format('woff2');unicode-range:U+1100-11FF,U+2000-2BFF,U+3000-33FF,U+AC00-D7AF,U+FF00-FFEF}
@font-face{font-family:'Noto KR';font-weight:500;src:url(fonts/noto-sans-kr-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF}
@font-face{font-family:'Noto KR';font-weight:700;src:url(fonts/noto-sans-kr-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF}
@font-face{font-family:'Noto KR';font-weight:900;src:url(fonts/noto-sans-kr-latin-900-normal.woff2) format('woff2');unicode-range:U+0000-00FF}
@font-face{font-family:'BHS';src:url(fonts/black-han-sans-korean-400-normal.woff2) format('woff2');unicode-range:U+1100-11FF,U+3000-33FF,U+AC00-D7AF}
@font-face{font-family:'BHS';src:url(fonts/black-han-sans-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF}

:root{
  --navy:#08303b; --deep:#05222b; --sea:#0f5a66; --green:#43b86a; --lime:#9be15d;
  --cream:#fff8e8; --coral:#ff7a59; --sun:#ffd24a; --ink:#12323a;
}
html,body{margin:0;padding:0;background:var(--deep)}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Noto KR',sans-serif;color:var(--cream);background:var(--deep)}
.abs{position:absolute}
.bhs{font-family:'BHS','Noto KR',sans-serif;font-weight:400}
.card{background:rgba(255,248,232,.96);color:var(--ink);border-radius:44px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.chip{display:inline-block;padding:14px 34px;border-radius:999px;font-weight:700;font-size:40px}
.center{left:0;right:0;text-align:center}
</style>
</head>
<body>
<div id="root"></div>
<script src="script.js"></script>
<script>
// ------------------------------------------------------------------
// Deterministic motion graphics: renderAt(t) paints the frame at t sec.
// ------------------------------------------------------------------
const W = 1080, H = 1920, DURATION = 60;

const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const P = (t, a, b) => cl((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eb = x => { const c1 = 1.9, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const rnd = (i) => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// Style fragments for common entrances.
const pop = (t, a, d = .5) => { const x = P(t, a, a + d); return `opacity:${cl(x * 4)};transform:scale(${eb(x)})`; };
const rise = (t, a, d = .6, dist = 70) => { const x = eo(P(t, a, a + d)); return `opacity:${x};transform:translateY(${(1 - x) * dist}px)`; };
const slideX = (t, a, d = .6, dist = 200) => { const x = eo(P(t, a, a + d)); return `opacity:${x};transform:translateX(${(1 - x) * dist}px)`; };

// ---------------------------- Timeline -----------------------------
const SCENES = [
  { id: 'intro', a: 0,    b: 5,    fn: sIntro },
  { id: 'what',  a: 5,    b: 11,   fn: sWhat },
  { id: 'b1',    a: 11,   b: 18.5, fn: sIron },
  { id: 'b2',    a: 18.5, b: 26,   fn: sFiber },
  { id: 'b3',    a: 26,   b: 33,   fn: sDiet },
  { id: 'b4',    a: 33,   b: 40,   fn: sHangover },
  { id: 'b5',    a: 40,   b: 47,   fn: sImmune },
  { id: 'tip',   a: 47,   b: 54.5, fn: sTip },
  { id: 'outro', a: 54.5, b: 60,   fn: sOutro },
];

const CAPTIONS = window.CAPTIONS.map(c => [c.a, c.b, c.text]);

// ----------------------------- Icons -------------------------------
const ICON = {
  drop: c => `<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M50 8 C50 8 18 46 18 64 a32 32 0 0 0 64 0 C82 46 50 8 50 8Z" fill="${c}"/><ellipse cx="38" cy="62" rx="7" ry="12" fill="#fff" opacity=".5"/></svg>`,
  bone: c => `<svg viewBox="0 0 100 100" width="100%" height="100%"><g fill="${c}" transform="rotate(-35 50 50)"><rect x="22" y="40" width="56" height="20" rx="8"/><circle cx="22" cy="40" r="12"/><circle cx="22" cy="60" r="12"/><circle cx="78" cy="40" r="12"/><circle cx="78" cy="60" r="12"/></g></svg>`,
  check: c => `<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="46" fill="${c}"/><path d="M28 52 L44 67 L73 35" stroke="#fff" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  shield: c => `<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M50 6 L88 20 V48 C88 72 70 88 50 95 C30 88 12 72 12 48 V20Z" fill="${c}"/><path d="M50 16 L78 26 V48 C78 66 65 79 50 85Z" fill="#fff" opacity=".22"/><path d="M32 50 L45 63 L69 37" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  sparkle: c => `<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M50 0 C54 36 64 46 100 50 C64 54 54 64 50 100 C46 64 36 54 0 50 C36 46 46 36 50 0Z" fill="${c}"/></svg>`,
  thumb: c => `<svg viewBox="0 0 100 100" width="100%" height="100%"><rect x="10" y="44" width="18" height="44" rx="4" fill="${c}"/><path d="M34 46 L52 14 C58 10 66 14 64 24 L60 40 H84 C92 40 96 48 93 55 L84 82 C82 87 78 90 72 90 H34Z" fill="${c}"/></svg>`,
  bell: c => `<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M50 10 C32 10 24 26 24 42 V60 L14 74 H86 L76 60 V42 C76 26 68 10 50 10Z" fill="${c}"/><circle cx="50" cy="84" r="9" fill="${c}"/></svg>`,
  flame: c => `<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M50 4 C58 26 80 36 80 62 A30 30 0 0 1 20 62 C20 46 30 38 34 26 C40 36 44 40 48 40 C50 28 48 16 50 4Z" fill="${c}"/><path d="M50 50 C54 60 64 64 64 74 A14 14 0 0 1 36 74 C36 66 44 62 50 50Z" fill="#fff" opacity=".55"/></svg>`,
  leaf: c => `<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M14 86 C10 40 44 10 90 10 C90 56 60 90 14 86Z" fill="${c}"/><path d="M18 82 C40 60 58 42 78 22" stroke="#fff" stroke-width="5" fill="none" opacity=".6" stroke-linecap="round"/></svg>`,
  gut: c => `<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M22 20 H78 V38 H26 V56 H74 V74 H30" stroke="${c}" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};

// ---------------------------- Mascot -------------------------------
// "매생이 요정": a fuzzy green blob made of fine strands.
function mascot(t, size, opts = {}) {
  const bounce = Math.sin(t * 4.2) * 8;
  const blink = (t % 3.1) < 0.12 ? 0.1 : 1;
  const wave = opts.wave ? Math.sin(t * 9) * 22 : Math.sin(t * 2) * 6;
  let hair = '';
  for (let i = 0; i < 17; i++) {
    const x = 42 + i * 7;
    const sway = Math.sin(t * 3 + i * .7) * 6;
    hair += `<path d="M${x} 70 Q${x + sway} ${40 - (i % 3) * 6} ${x + sway * 1.8} ${22 - (i % 4) * 5}" stroke="${i % 2 ? '#6fd36a' : '#3fa65e'}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  }
  const mouth = opts.mouth === 'o'
    ? `<ellipse cx="100" cy="146" rx="10" ry="12" fill="#1c3b2a"/>`
    : `<path d="M86 140 Q100 156 114 140" stroke="#1c3b2a" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 200 220" width="${size}" height="${size * 1.1}" style="transform:translateY(${bounce}px);overflow:visible">
    <ellipse cx="100" cy="212" rx="62" ry="9" fill="#000" opacity=".18"/>
    ${hair}
    <g transform="rotate(${-20 + wave} 42 130)"><path d="M42 130 Q18 116 14 92" stroke="#3fa65e" stroke-width="14" fill="none" stroke-linecap="round"/></g>
    <g transform="rotate(${14 - wave * .4} 158 130)"><path d="M158 130 Q182 140 186 160" stroke="#3fa65e" stroke-width="14" fill="none" stroke-linecap="round"/></g>
    <path d="M40 120 C36 70 70 58 100 58 C130 58 164 70 160 120 C158 170 136 200 100 200 C64 200 42 170 40 120Z" fill="#4cbf6b"/>
    <path d="M58 104 C60 80 76 72 96 70" stroke="#9be15d" stroke-width="8" fill="none" stroke-linecap="round" opacity=".7"/>
    <ellipse cx="78" cy="120" rx="10" ry="${13 * blink}" fill="#1c3b2a"/>
    <ellipse cx="122" cy="120" rx="10" ry="${13 * blink}" fill="#1c3b2a"/>
    <circle cx="81" cy="115" r="3.5" fill="#fff" opacity="${blink}"/><circle cx="125" cy="115" r="3.5" fill="#fff" opacity="${blink}"/>
    <ellipse cx="62" cy="142" rx="12" ry="7" fill="#ff8f8f" opacity=".6"/><ellipse cx="138" cy="142" rx="12" ry="7" fill="#ff8f8f" opacity=".6"/>
    ${mouth}
  </svg>`;
}

// -------------------------- Background -----------------------------
function background(t) {
  let bubbles = '';
  for (let i = 0; i < 26; i++) {
    const x = rnd(i) * W + Math.sin(t * 1.3 + i) * 18;
    const speed = 50 + rnd(i + 40) * 90;
    const y = H + 60 - ((rnd(i + 80) * (H + 120) + t * speed) % (H + 120));
    const r = 6 + rnd(i + 11) * 18;
    bubbles += `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#bff3ff" stroke-width="3" opacity="${.12 + rnd(i + 5) * .2}"/>`;
  }
  let weeds = '';
  for (let i = 0; i < 14; i++) {
    const x0 = -30 + i * 84 + rnd(i + 3) * 30;
    const h = 220 + rnd(i + 9) * 240;
    const s = Math.sin(t * 1.4 + i * .9) * 40;
    const col = i % 3 === 0 ? '#1f7a52' : i % 3 === 1 ? '#2c9a5c' : '#17644a';
    weeds += `<path d="M${x0} ${H} C${x0 + s * .3} ${H - h * .35} ${x0 - s * .6} ${H - h * .65} ${x0 + s} ${H - h}" stroke="${col}" stroke-width="${16 + rnd(i) * 10}" fill="none" stroke-linecap="round" opacity=".55"/>`;
  }
  let rays = '';
  for (let i = 0; i < 5; i++) {
    const x = 120 + i * 220 + Math.sin(t * .4 + i) * 40;
    rays += `<path d="M${x} -20 L${x + 90} -20 L${x + 330} ${H} L${x + 170} ${H}Z" fill="#dffbff" opacity="${.035 + .02 * Math.sin(t * .8 + i * 2)}"/>`;
  }
  return `<svg class="abs" style="left:0;top:0" width="${W}" height="${H}">
    <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b7a86"/><stop offset=".45" stop-color="#0d4c5a"/><stop offset="1" stop-color="#05222b"/>
    </linearGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#bg)"/>${rays}${bubbles}${weeds}</svg>`;
}

// ------------------------------ HUD --------------------------------
function hud(t) {
  const rec = (Math.floor(t * 2) % 2 === 0);
  const s = Math.floor(t), fr = Math.floor((t % 1) * 30);
  const tc = `00:00:${String(s).padStart(2, '0')}:${String(fr).padStart(2, '0')}`;
  const bracket = (x, y, rx, ry) => `<path d="M${x} ${y + 70 * ry} V${y} H${x + 70 * rx}" stroke="#fff" stroke-width="6" fill="none" opacity=".75"/>`;
  let dots = '';
  SCENES.forEach((sc, i) => {
    const done = t >= sc.a;
    dots += `<div style="flex:${sc.b - sc.a};height:10px;border-radius:6px;background:rgba(255,255,255,.22);overflow:hidden">
      <div style="height:100%;width:${cl((t - sc.a) / (sc.b - sc.a)) * 100}%;background:${done ? 'var(--lime)' : 'transparent'}"></div></div>`;
  });
  return `
  <svg class="abs" style="left:0;top:0" width="${W}" height="${H}">
    ${bracket(40, 40, 1, 1)}${bracket(W - 40, 40, -1, 1)}
    ${bracket(40, H - 40, 1, -1)}${bracket(W - 40, H - 40, -1, -1)}
  </svg>
  <div class="abs" style="left:70px;right:70px;top:70px;display:flex;gap:10px">${dots}</div>
  <div class="abs" style="left:72px;top:104px;display:flex;align-items:center;gap:14px;font-weight:900;font-size:34px;letter-spacing:2px">
    <span style="width:26px;height:26px;border-radius:50%;background:#ff3b3b;opacity:${rec ? 1 : .15};box-shadow:0 0 18px #ff3b3b"></span>REC
  </div>
  <div class="abs" style="right:72px;top:106px;font-weight:700;font-size:30px;letter-spacing:2px;opacity:.9;display:flex;gap:18px;align-items:center">
    ${tc}
    <span style="display:inline-block;width:52px;height:26px;border:4px solid #fff;border-radius:6px;position:relative">
      <span style="position:absolute;left:3px;top:3px;bottom:3px;width:70%;background:var(--lime);border-radius:2px"></span></span>
  </div>
  <div class="abs" style="left:72px;top:160px;font-size:28px;font-weight:700;opacity:.85;background:rgba(0,0,0,.25);padding:6px 20px;border-radius:12px">VLOG · 갯푸른 매생이 탐구</div>`;
}

// Apple-keynote-style kinetic captions: words rise out of a blur one by one,
// {braced} words get a gradient, and the line dissolves upward on exit.
const expo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
function tokenize(text) {
  // Returns word groups (어절). "{...}" marks gradient emphasis; spaces separate 어절, so
  // "{철분과 칼슘}이" stays one unbreakable group.
  const out = []; let em = false, word = '', wordEm = false;
  const flush = () => { if (word) out.push({ w: word, em: wordEm }); word = ''; wordEm = false; };
  for (const ch of text) {
    if (ch === '{') { flush(); em = true; continue; }
    if (ch === '}') { flush(); em = false; continue; }
    if (ch === ' ') { flush(); out.push(null); continue; }
    if (!word) wordEm = em;
    word += ch;
  }
  flush();
  const groups = []; let cur = [];
  for (const tk of out) { if (tk === null) { if (cur.length) groups.push(cur); cur = []; } else cur.push(tk); }
  if (cur.length) groups.push(cur);
  return groups;
}

// Split a caption into display lines. Authors mark semantic breaks with "|" in script.js
// (clause / phrase boundaries). Unmarked lines that are too long are broken at the 어절
// boundary closest to the middle, preferring a comma, so a word or phrase is never split.
const MAX_CHARS = 17;
const glen = g => g.reduce((n, f) => n + f.w.length, 0);
function captionLines(text) {
  const lines = [];
  for (const part of text.split('|').map(x => x.trim()).filter(Boolean)) {
    const groups = tokenize(part);
    const total = groups.reduce((n, g) => n + glen(g), 0) + groups.length - 1;
    if (total <= MAX_CHARS || groups.length < 2) { lines.push(groups); continue; }
    let best = 1, bestScore = Infinity, run = 0;
    for (let i = 1; i < groups.length; i++) {
      run += glen(groups[i - 1]) + 1;
      const last = groups[i - 1][groups[i - 1].length - 1].w;
      const score = Math.abs(run - total / 2) - (/[,，]$/.test(last) ? 6 : 0);
      if (score < bestScore) { bestScore = score; best = i; }
    }
    lines.push(groups.slice(0, best), groups.slice(best));
  }
  return lines;
}

function caption(t) {
  const c = CAPTIONS.find(c => t >= c[0] - .05 && t < c[1]);
  if (!c) return '';
  const [a, b, text] = c;
  const lines = captionLines(text);
  const longest = Math.max(...lines.map(l => l.reduce((n, g) => n + glen(g), 0) + l.length - 1));
  const size = Math.min(64, Math.floor(930 / (longest * .93)));
  let idx = 0, html = '';
  lines.forEach((groups, li) => {
    let row = '';
    groups.forEach(g => {
      const i = idx++;
      const s0 = a + i * .075 + li * .12;
      const x = expo(P(t, s0, s0 + .8));
      const o0 = b - .38 + i * .02;
      const y = eio(P(t, o0, o0 + .3));
      const op = x * (1 - y);
      const blur = (1 - x) * 16 + y * 12;
      const inner = g.map(f => f.em
        ? `<span style="background:linear-gradient(100deg,#d4ff8a 0%,#8ef0a0 45%,#5fd8e8 100%);-webkit-background-clip:text;background-clip:text;color:transparent">${f.w}</span>`
        : f.w).join('');
      row += `<span style="display:inline-block;margin:0 .14em;opacity:${op.toFixed(3)};filter:blur(${blur.toFixed(2)}px);transform:translateY(${((1 - x) * 46 - y * 26).toFixed(1)}px) scale(${(.94 + .06 * x).toFixed(3)})">${inner}</span>`;
    });
    html += `<div style="white-space:nowrap">${row}</div>`;
  });
  return `<div class="abs" style="left:0;right:0;bottom:0;height:600px;background:linear-gradient(180deg,rgba(3,22,28,0) 0%,rgba(3,22,28,.55) 45%,rgba(3,22,28,.82) 100%)"></div>
    <div class="abs center" style="bottom:190px">
      <div style="display:inline-block;font-size:${size}px;font-weight:900;letter-spacing:-0.035em;line-height:1.24;color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.35)">${html}</div>
    </div>`;
}

// ---------------------------- Scenes -------------------------------
// Each scene gets local time lt and duration d; content is laid out in a
// 1080x1300 frame starting at y=260. Photos come from 갯푸른 (photos/).

// 갯푸른 character: gentle bob + sway, optional wave (rocking rotation).
function chara(t, h, opts = {}) {
  const bob = Math.sin(t * 3.6) * 10;
  const rot = opts.wave ? Math.sin(t * 5) * 5 : Math.sin(t * 1.8) * 2;
  return `<img src="photos/gaetpureun.png" style="height:${h}px;display:block;transform:translateY(${bob}px) rotate(${rot}deg);transform-origin:50% 90%;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))">`;
}

// Rounded photo card with a slow Ken Burns push and an optional caption tag.
function pcard(src, x, y, w, h, lt, a, tag = '', pos = '50% 50%') {
  const e = eo(P(lt, a, a + .7)), k = P(lt, a, a + 8);
  return `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:36px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.4);opacity:${e};transform:translateY(${(1 - e) * 80}px) scale(${.96 + .04 * e})">
    <img src="photos/${src}" style="width:100%;height:100%;object-fit:cover;object-position:${pos};transform:scale(${1.04 + .08 * k})">
    ${tag ? `<div style="position:absolute;left:24px;bottom:22px;padding:10px 24px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:30px;font-weight:700;opacity:${P(lt, a + .5, a + .9)}">${tag}</div>` : ''}
  </div>`;
}
const num = n => Math.round(n).toLocaleString('en-US');

function sIntro(lt) {
  let letters = '';
  [...'매생이'].forEach((ch, i) => {
    const x = P(lt, .7 + i * .16, .7 + i * .16 + .55);
    letters += `<span style="display:inline-block;opacity:${cl(x * 3)};transform:translateY(${(1 - eb(x)) * -200}px)">${ch}</span>`;
  });
  const ul = eo(P(lt, 1.6, 2.2));
  return `
    ${pcard('farm.jpg', 60, 10, 960, 560, lt, .1, '청정 남해안 매생이 갯벌')}
    <div class="abs" style="left:80px;top:610px;${rise(lt, .5)}"><span class="chip" style="background:var(--sun);color:var(--ink)">겨울 제철 슈퍼푸드</span></div>
    <div class="abs bhs" style="left:70px;top:690px;font-size:220px;line-height:1;color:#b8f07a;text-shadow:0 10px 0 #1f6b45,0 24px 50px rgba(0,0,0,.5);letter-spacing:6px">${letters}</div>
    <div class="abs" style="left:80px;top:960px;${rise(lt, 1.5)}">
      <div style="display:inline-block;position:relative;font-size:76px;font-weight:900">효능 <span style="color:var(--sun)">1분</span> 정리
        <div style="position:absolute;left:0;bottom:-12px;height:12px;border-radius:8px;background:var(--coral);width:${ul * 100}%"></div></div>
    </div>
    <div class="abs" style="right:40px;top:640px;${pop(lt, 1.1, .7)}">${chara(lt, 450, { wave: true })}</div>`;
}

function sWhat(lt) {
  const rows = [['완도', 2154], ['장흥', 1715], ['강진', 533], ['고흥', 352], ['해남', 154]];
  let bars = '';
  rows.forEach(([name, v], i) => {
    const a0 = 2.2 + i * .15, x = eo(P(lt, a0, a0 + 1.1));
    const home = name === '강진';
    bars += `<div style="display:flex;align-items:center;height:66px;${rise(lt, a0 - .2, .4, 30)}">
      <div style="width:110px;font-size:40px;font-weight:900;color:${home ? '#1f7a45' : 'var(--ink)'}">${name}</div>
      <div style="flex:1;height:40px;position:relative">
        <div style="height:100%;width:${(v / 2154) * 78 * x}%;border-radius:20px;background:${home ? 'linear-gradient(90deg,#43b86a,#9be15d)' : '#cfe3d4'}"></div>

function sFiber(lt) {
  const pts = [];
  const rows = 3, left = 170, right = 790, top = 80, gap = 110;
  for (let r = 0; r < rows; r++) {
    const y = top + r * gap;
    const xs = r % 2 === 0 ? [left, right] : [right, left];
    for (let k = 0; k <= 20; k++) pts.push([xs[0] + (xs[1] - xs[0]) * k / 20, y]);
    if (r < rows - 1) {
      const cx = xs[1], cy = y + gap / 2, dir = r % 2 === 0 ? 1 : -1;
      for (let k = 1; k < 12; k++) { const a = -Math.PI / 2 + Math.PI * k / 12; pts.push([cx + dir * Math.cos(a) * gap / 2, cy + Math.sin(a) * gap / 2]); }
    }
  }
  const segs = [0];
  for (let i = 1; i < pts.length; i++) segs.push(segs[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const total = segs[segs.length - 1];
  const at = d => { d = ((d % total) + total) % total; let i = 1; while (i < segs.length - 1 && segs[i] < d) i++; const f = (d - segs[i - 1]) / (segs[i] - segs[i - 1] || 1); return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f]; };
  const draw = eio(P(lt, 1.2, 2.6));
  const poly = pts.map(p => p.join(',')).join(' ');
  let dots = '';
  if (lt > 2.4) for (let i = 0; i < 12; i++) {
    const [x, y] = at(i * total / 12 + (lt - 2.4) * 240);
    dots += `<circle cx="${x}" cy="${y}" r="${12 + (i % 3) * 3}" fill="${i % 2 ? '#43b86a' : '#9be15d'}" opacity="${P(lt, 2.4, 2.8)}"/>`;
  }
  const visual = `
    <svg class="abs" style="left:0;top:0" width="960" height="540">
      <polyline points="${poly}" fill="none" stroke="#ffd9cf" stroke-width="70" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${total}" stroke-dashoffset="${total * (1 - draw)}"/>
      <polyline points="${poly}" fill="none" stroke="#ffb8a6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".6" stroke-dasharray="${total}" stroke-dashoffset="${total * (1 - draw)}"/>
      ${dots}
    </svg>
    <div class="abs" style="left:40px;right:40px;top:410px;display:flex;justify-content:space-around">
      <span class="chip" style="background:#e6f6ea;color:#1f7a45;${pop(lt, 3.2)}">장 운동 활발</span>
      <span class="chip" style="background:#e6f6ea;color:#1f7a45;${pop(lt, 3.5)}">변비 예방</span>
      <span class="chip" style="background:#e6f6ea;color:#1f7a45;${pop(lt, 3.8)}">소화가 잘돼요</span>
    </div>`;
  return benefitFrame(lt, '02', '식이섬유', '#9be15d', 'underwater.jpg', '장 건강 & 쾌변', visual);
}

function photoLayer(t) {
  let html = '';
  SCENES.forEach((sc, i) => {
    const src = SCENE_BG[sc.id];
    const lt = t - sc.a, d = sc.b - sc.a;
    if (!src || lt < -0.5 || lt > d + 0.5) return;
    const op = Math.min(P(lt, -0.3, 0.3), 1 - P(lt, d - 0.2, d + 0.4));
    if (op <= 0) return;
    const k = P(lt, -0.5, d + 0.5), dir = i % 2 ? 1 : -1;
    html += `<div class="abs" style="inset:0;overflow:hidden;opacity:${op}">

      <div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(4,26,32,.35) 0%,rgba(4,26,32,.15) 40%,rgba(4,26,32,.6) 100%)"></div></div>`;
  });
  return html;
}

function renderAt(t) {
  const sway = `translate(${Math.sin(t * 1.3) * 5 + Math.sin(t * 3.1) * 2}px, ${Math.cos(t * 1.1) * 4 + Math.sin(t * 2.7) * 2}px) rotate(${Math.sin(t * .7) * .35}deg) scale(1.02)`;
  let scenes = '';
  for (const sc of SCENES) {
    const lt = t - sc.a, d = sc.b - sc.a;
    if (lt < -0.01 || lt > d + 0.4) continue;
    const inX = eo(P(lt, 0, .45));
    const outX = eio(P(lt, d - .35, d));
    const isLast = sc.id === 'outro';
    const tx = (1 - inX) * 260 - (isLast ? 0 : outX * 300);
    const op = Math.min(inX, isLast ? 1 - P(t, 59.4, 60) : 1 - outX);
    if (op <= 0) continue;
    scenes += `<div class="abs" style="left:0;top:260px;width:1080px;height:1300px;opacity:${op};transform:translateX(${tx}px)">${sc.fn(lt, d)}</div>`;
  }
  // Scene-change flash for a "cut" feel.
  let flash = 0;
  for (const sc of SCENES) if (sc.a > 0) flash = Math.max(flash, 1 - Math.abs(t - sc.a) / .12);
  const fadeIn = 1 - P(t, 0, .4);
  document.getElementById('root').innerHTML = `
    <div class="abs" style="left:0;top:0;width:${W}px;height:${H}px;transform:${sway};transform-origin:50% 50%">
      ${background(t)}${photoLayer(t)}${scenes}
    </div>
    ${hud(t)}${caption(t)}
    <div class="abs" style="inset:0;background:#fff;opacity:${cl(flash) * .35};pointer-events:none"></div>
    <div class="abs" style="inset:0;background:radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.35) 100%)"></div>
    <div class="abs" style="inset:0;background:#000;opacity:${Math.max(fadeIn, P(t, 59.4, 60))}"></div>`;
}

window.renderAt = renderAt;
window.DURATION = DURATION;
window.SCENES = SCENES;
// Preview in a normal browser: play in real time (add ?t=12 to freeze).
const q = new URLSearchParams(location.search);
if (q.has('t')) renderAt(parseFloat(q.get('t')));
else if (!q.has('render')) { const t0 = performance.now(); const loop = () => { renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); }
</script>
</body>
</html>
